<!doctype html>
<html lang="en" data-theme="system" data-saved-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F1E7">
  <script src="{{ url_for('static', filename='js/shell/theme_bootstrap.js') }}"></script>
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Sign in — Nicotine Tracker{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/pwa/icon-180.png') }}">
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <meta name="application-name" content="Nicotine Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nicotine Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="auth-shell{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="auth-brand"><a class="wordmark" href="{{ url_for('index') }}" aria-label="Nicotine Tracker home"><img src="{{ url_for('static', filename='brand/nicotine-tracker-two-point-n-symbol.png') }}" alt="" aria-hidden="true"><span>Nicotine Tracker</span></a></header>
  <div id="flash-messages" class="flash-region" aria-live="polite" aria-atomic="true">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash-message flash-message--{{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
  </div>
  <main id="main-content" class="auth-content" tabindex="-1">{% block content %}{% endblock %}</main>
  <script type="module" src="{{ url_for('static', filename='js/shell/theme.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/shell/pwa.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
