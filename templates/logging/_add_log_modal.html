<div id="addLogModal"
  class="hs-overlay hidden size-full fixed top-0 start-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
  role="dialog" tabindex="-1" aria-labelledby="addLogModalLabel">
  <div class="hs-overlay-animation-target hs-overlay-open:scale-100 hs-overlay-open:opacity-100 scale-95 opacity-0 ease-in-out transition-all duration-200 sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-56px)] flex items-center">
    <form id="add-log-form" method="POST" action="{{ url_for('logging.add_log') }}"
      class="w-full flex flex-col bg-white border border-gray-200 shadow-2xs rounded-xl pointer-events-auto dark:bg-gray-800 dark:border-gray-700 dark:shadow-gray-700/70"
      data-validate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200 dark:border-gray-700">
        <h3 id="addLogModalLabel" class="font-bold text-gray-800 dark:text-white">
          Add Log Entry
        </h3>
        <button type="button"
          class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-hidden focus:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-gray-400 dark:focus:bg-gray-600"
          aria-label="Close" data-hs-overlay="#addLogModal">
          <span class="sr-only">Close</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4">
        <div>
          <label for="log_date" class="block text-sm font-medium text-gray-900 dark:text-white">Date *</label>
          <input type="date" name="log_date" id="log_date" required value="{{ today }}"
            class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 dark:bg-gray-700 dark:text-white dark:ring-gray-600">
        </div>

        <div>
          <label for="log_time" class="block text-sm font-medium text-gray-900 dark:text-white">Time (Optional)</label>
          <input type="time" name="log_time" id="log_time" value="{{ current_time or '' }}"
            class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 dark:bg-gray-700 dark:text-white dark:ring-gray-600">
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            Time is shown in your timezone: {{ (user.timezone if user else user_timezone) or 'UTC' }}
          </p>
        </div>

        <div>
          <label for="pouch_selection" class="block text-sm font-medium text-gray-900 dark:text-white">Pouch Type *</label>
          <select name="pouch_id" id="pouch_selection" required
            class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 dark:bg-gray-700 dark:text-white dark:ring-gray-600">
            <option value="">Select a pouch…</option>
            {% if user_pouches %}
            <optgroup label="Your Custom Pouches">
              {% for pouch in user_pouches %}
              <option value="{{ pouch.id }}">{{ pouch.brand }} ({{ pouch.nicotine_mg }}mg) [Custom]</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            {% if default_pouches %}
            <optgroup label="Default Pouches">
              {% for pouch in default_pouches %}
              <option value="{{ pouch.id }}">{{ pouch.brand }} ({{ pouch.nicotine_mg }}mg)</option>
              {% endfor %}
            </optgroup>
            {% endif %}
          </select>
        </div>

        <div>
          <label for="quantity" class="block text-sm font-medium text-gray-900 dark:text-white">Quantity *</label>
          <div
            class="py-2 px-3 w-full rounded-md border-0 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 dark:bg-gray-700 dark:text-white dark:ring-gray-600"
            data-hs-input-number="">
            <div class="w-full flex justify-between items-center gap-x-5">
              <div class="grow">
                <input
                  class="w-full rounded-md shadow-none ring-0 border-0 bg-transparent p-0 px-2 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none text-gray-900 placeholder:text-gray-400 sm:text-sm sm:leading-6 dark:bg-gray-700 dark:text-white "
                  style="-moz-appearance: textfield;" type="number" aria-roledescription="Number field"
                  name="quantity" id="quantity" min="1" max="50" value="1" required data-hs-input-number-input="">
              </div>
              <div class="flex justify-end items-center gap-x-1.5">
                <button type="button"
                  class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-md border ring-1 ring-inset border-gray-200 bg-white dark:bg-gray-900 text-gray-900 dark:text-white ring-gray-300 dark:ring-gray-500 hover:bg-gray-50 dark:hover:bg-gray-600 shadow-2xs focus:outline-hidden focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:border-neutral-500 dark:focus:bg-neutral-800"
                  tabindex="-1" aria-label="Decrease" data-hs-input-number-decrement="">
                  <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
                <button type="button"
                  class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-md border ring-1 ring-inset border-gray-200 bg-white dark:bg-gray-900 text-gray-900 dark:text-white ring-gray-300 dark:ring-gray-500 hover:bg-gray-50 dark:hover:bg-gray-600 shadow-2xs focus:outline-hidden focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:border-neutral-500 dark:focus:bg-neutral-800"
                  tabindex="-1" aria-label="Increase" data-hs-input-number-increment="">
                  <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="M12 5v14"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label for="notes" class="block text-sm font-medium text-gray-900 dark:text-white">Notes (Optional)</label>
          <textarea name="notes" id="notes" rows="3" placeholder="Add any notes…"
            class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 dark:bg-gray-700 dark:text-white dark:ring-gray-600"></textarea>
        </div>
      </div>

      <div class="flex justify-end items-center gap-x-2 py-3 px-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:bg-gray-700 dark:focus:bg-gray-700"
          data-hs-overlay="#addLogModal">
          Cancel
        </button>
        <button type="submit"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-indigo-600 text-white hover:bg-indigo-500 focus:outline-hidden focus:bg-indigo-700 disabled:opacity-50 disabled:pointer-events-none">
          Add Entry
        </button>
      </div>
    </form>
  </div>
</div>
