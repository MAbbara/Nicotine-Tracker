<dialog
  id="addLogModal"
  class="log-dialog"
  aria-labelledby="addLogModalLabel"
  {% if open_add_modal %}data-auto-open="true"{% endif %}
>
  <div class="log-dialog__position">
    <form id="add-log-form" class="logging-form log-dialog__panel" method="post" action="{{ url_for('logging.add_log') }}" data-validate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="user_timezone" value="{{ (user.timezone if user else user_timezone) or 'UTC' }}">

      <header class="log-dialog__header">
        <div>
          <p class="eyebrow">Add to your record</p>
          <h2 id="addLogModalLabel">Add a log</h2>
        </div>
        <button class="log-dialog__close" type="button" aria-label="Close add log dialog" data-hs-overlay="#addLogModal">×</button>
      </header>

      <div class="log-dialog__body">
        <div class="logging-form__split">
          <div class="c-field">
            <label class="c-field__label" for="log_date">Date</label>
            <input class="c-field__control" type="date" name="log_date" id="log_date" required value="{{ today }}">
          </div>
          <div class="c-field">
            <label class="c-field__label" for="log_time">Time</label>
            <input class="c-field__control" type="time" name="log_time" id="log_time" value="{{ current_time or '' }}" aria-describedby="add-log-time-help">
          </div>
        </div>
        <p class="c-field__description" id="add-log-time-help">Optional. Times use {{ (user.timezone if user else user_timezone) or 'UTC' }}.</p>

        <div class="c-field">
          <label class="c-field__label" for="pouch_selection">Product</label>
          <select class="c-field__control" name="pouch_id" id="pouch_selection" required data-product-select>
            <option value="">Choose a product</option>
            {% if user_pouches %}
            <optgroup label="Your products">
              {% for pouch in user_pouches %}
              <option value="{{ pouch.id }}">{{ pouch.brand }} · {{ pouch.nicotine_mg_display() }} mg</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            {% if default_pouches %}
            <optgroup label="Catalog">
              {% for pouch in default_pouches %}
              <option value="{{ pouch.id }}">{{ pouch.brand }} · {{ pouch.nicotine_mg_display() }} mg</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            <option value="custom">Custom product</option>
          </select>
        </div>

        <div class="logging-form__custom" data-custom-product-fields hidden>
          <div class="c-field">
            <label class="c-field__label" for="custom_brand">Custom brand</label>
            <input class="c-field__control" type="text" name="custom_brand" id="custom_brand" maxlength="80" autocomplete="off">
          </div>
          <div class="c-field">
            <label class="c-field__label" for="custom_nicotine_mg">Nicotine strength</label>
            <input class="c-field__control" type="number" name="custom_nicotine_mg" id="custom_nicotine_mg" min="0.01" max="100" step="0.01" inputmode="decimal" aria-describedby="custom-strength-help">
            <p class="c-field__description" id="custom-strength-help">Milligrams per pouch.</p>
          </div>
        </div>

        <div class="c-field">
          <label class="c-field__label" for="quantity">Quantity</label>
          <input class="c-field__control" type="number" name="quantity" id="quantity" min="1" max="50" step="1" value="1" required inputmode="numeric">
        </div>

        <div class="c-field">
          <label class="c-field__label" for="notes">Notes</label>
          <textarea class="c-field__control" name="notes" id="notes" rows="3" maxlength="1000" placeholder="Optional context that may help later"></textarea>
        </div>
      </div>

      <footer class="log-dialog__actions">
        <button class="c-button c-button--secondary" type="button" data-hs-overlay="#addLogModal">Cancel</button>
        <button class="c-button c-button--primary" type="submit">Add entry</button>
      </footer>
    </form>
  </div>
</dialog>
<script type="module" src="{{ url_for('static', filename='js/logging/forms.js') }}"></script>
