[pytest]
# Extend (not replace) pytest's default ignores: keep the default
# dot-directory, venv, build, and distribution ignores, and add the
# project-specific directories that must never be collected.
# Nothing under tests/ matches these names, so no real test subtree is hidden.
norecursedirs = .* *.egg *.egg-info _darcs build CVS dist venv {arch} .git .venv node_modules .hypothesis .pytest_cache .superpowers Archive temp __pycache__
